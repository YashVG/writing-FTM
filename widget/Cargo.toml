[package]
name = "writing-ftm-widget"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSString", "NSURL"] }
objc2-vision = { version = "0.3", features = ["VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNObservation"] }

[profile.release]
opt-level = 2
